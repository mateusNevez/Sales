<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Dashboard de Vendas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">

    <!-- ===== Cabeçalho ===== -->
    <header class="topo">
      <div class="topo__marca">
        <span class="logo" aria-hidden="true">V</span>
        <div class="topo__texto">
          <h1>Dashboard de Vendas</h1>
          <p class="topo__data" id="dataAtual">—</p>
        </div>
      </div>
      <span class="badge-dia" id="badgeDia">Hoje</span>
    </header>

    <!-- ===== Cards de resumo ===== -->
    <section class="cards" aria-label="Resumo de vendas">
      <article class="card card--azul">
        <span class="card__label">Total de vendas</span>
        <strong class="card__valor" id="totalVendas">R$ 0,00</strong>
        <span class="card__sub" id="subTotal">0 registros</span>
      </article>

      <article class="card">
        <span class="card__label">Vendas hoje</span>
        <strong class="card__valor" id="vendasHoje">R$ 0,00</strong>
        <span class="card__sub" id="qtdHoje">0 vendas</span>
      </article>

      <article class="card">
        <span class="card__label">Qtd. de vendas</span>
        <strong class="card__valor" id="qtdVendas">0</strong>
        <span class="card__sub">Total registrado</span>
      </article>

      <article class="card">
        <span class="card__label">Ticket médio</span>
        <strong class="card__valor" id="ticketMedio">R$ 0,00</strong>
        <span class="card__sub">Por venda</span>
      </article>
    </section>

    <!-- ===== Formulário ===== -->
    <section class="painel" aria-label="Cadastro de venda">
      <form class="form" id="formVenda" autocomplete="off" novalidate>

        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" name="valor" step="0.01" min="0.01"
                 placeholder="0,00" required>
        </div>

        <div class="acoes-form">
          <button type="submit" class="btn btn--azul" id="btnSalvar">Adicionar</button>
          <button type="button" class="btn btn--cinza" id="btnCancelar" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <!-- ===== Lista ===== -->
    <section class="painel" aria-label="Lista de vendas">
      <div class="lista-topo">
        <h2>Vendas <span class="contador" id="contadorLista">(0)</span></h2>

        <div class="ordenar">
          <label for="ordenacao">Ordenar por</label>
          <select id="ordenacao">
            <option value="adicao">Ordem de adição</option>
            <option value="adicao-desc">Adição (mais recentes)</option>
            <option value="maior">Maior valor</option>
            <option value="menor">Menor valor</option>
            <option value="nome-az">Nome (A–Z)</option>
            <option value="nome-za">Nome (Z–A)</option>
          </select>
        </div>
      </div>

      <ul class="lista" id="listaVendas"></ul>

      <p class="vazio" id="vazio">
        Nenhuma venda registrada ainda.<br>
        <span>Adicione a primeira venda no formulário acima.</span>
      </p>
    </section>

  </main>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
